name: MyGo desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the verified MyGo desktop preview
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mygo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: MyGo ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, platform: darwin/arm64 }
          - { runner: macos-15-intel, platform: darwin/amd64 }
          - { runner: ubuntu-24.04, platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { runner: windows-latest, platform: windows/amd64 }
          - { runner: windows-11-arm, platform: windows/arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate immutable release source
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          version=$(python3 -c 'import json; print(json.load(open("desktop-mygo/mygo.json"))["version"])')
          tag="mygo-v$version"
          [[ "$tag" =~ ^mygo-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git cat-file -t "$tag")" = tag
          test "$(git rev-parse "$tag^{}")" = "$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to sign an existing release' >&2
            exit 1
          fi
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.27.1
          cache-dependency-path: desktop-mygo/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install Linux runtime and vault dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libdbus-1-dev pkg-config fonts-dejavu-core xvfb xauth
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Prepare dependencies
        run: |
          cd desktop-mygo
          go mod download
          cd ../core
          cargo +1.95.0 fetch --locked
      - name: Check Go and Rust desktop contract
        run: |
          set -euo pipefail
          cd desktop-mygo
          unformatted=$(gofmt -l ./*.go)
          if [[ -n "$unformatted" ]]; then
            printf 'Go formatting check failed:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          GOPROXY=off go vet ./...
          GOPROXY=off go test -count=1 ./...
          python3 scripts/test_licenses.py
          cd ../core
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 clippy --locked --offline -p chck-cli --all-targets --features desktop-vault -- -D warnings
          cargo +1.95.0 test --locked --offline -p chck-cli --lib desktop::tests::
      - name: Capture actual MyGo renderer with synthetic test mail
        if: matrix.platform == 'linux/amd64'
        working-directory: desktop-mygo
        env:
          IMYEMAIL_CLOUD_CAPTURE_PATH: ${{ runner.temp }}/imyemail-cloud-mygo.png
        run: GOPROXY=off go test -count=1 -run '^TestReadmeScreenshot$' ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.platform == 'linux/amd64'
        with:
          name: screenshot-mygo
          path: ${{ runner.temp }}/imyemail-cloud-mygo.png
          if-no-files-found: error
      - name: Build and package
        env:
          IMYEMAIL_CLOUD_SIGN_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main' && '1' || '0' }}
          RELEASE_P12_BASE64: ${{ runner.os != 'Linux' && github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main' && secrets.RELEASE_P12_BASE64 || '' }}
          RELEASE_P12_PASSWORD: ${{ runner.os != 'Linux' && github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main' && secrets.RELEASE_P12_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS && "$IMYEMAIL_CLOUD_SIGN_RELEASE" == 1 ]]; then
            bash scripts/prepare-macos-signing.sh
            IMYEMAIL_CLOUD_MACOS_SIGNING_IDENTITY=$(openssl x509 -in signing/release-cert.pem -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
            export IMYEMAIL_CLOUD_MACOS_SIGNING_IDENTITY
            export IMYEMAIL_CLOUD_MACOS_SIGNING_KEYCHAIN="$RUNNER_TEMP/imyemail-signing/release.keychain-db"
          fi
          export RUSTUP_TOOLCHAIN=1.95.0
          export GOPROXY=off
          export GOFLAGS=-trimpath
          export RUSTFLAGS=--remap-path-prefix="$GITHUB_WORKSPACE"=/imyemail-cloud
          bash desktop-mygo/scripts/package.sh '${{ matrix.platform }}'
      - name: Verify bundled engine and native view
        run: |
          set -euo pipefail
          cd desktop-mygo
          unpacked=$(mktemp -d)
          if [[ '${{ runner.os }}' == macOS ]]; then
            ditto -x -k dist/release/*-darwin-*.zip "$unpacked"
            codesign --verify --deep --strict "$unpacked/imyemail-cloud-mygo.app"
          elif [[ '${{ runner.os }}' == Windows ]]; then
            python3 -c 'import glob,sys,zipfile; zipfile.ZipFile(glob.glob("dist/release/*-windows-*.zip")[0]).extractall(sys.argv[1])' "$unpacked"
          else
            tar -xzf dist/release/*.tar.gz -C "$unpacked"
            mkdir "$unpacked/deb"
            dpkg-deb -x dist/release/*.deb "$unpacked/deb"
          fi
          python3 - "$unpacked" <<'PY'
          import hashlib
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          reference = next(pathlib.Path("resources").glob("imyemail-cloud-core*"))
          expected = hashlib.file_digest(reference.open("rb"), "sha256").hexdigest()
          helpers = list(root.rglob(reference.name))
          expected_count = 2 if (root / "deb").is_dir() else 1
          assert len(helpers) == expected_count, "packaged helper missing or duplicated"
          for helper in helpers:
              assert hashlib.file_digest(helper.open("rb"), "sha256").hexdigest() == expected, "packaged helper differs from this build"
          PY
          binary=$(python3 -c 'import pathlib,sys; names={"imyemail-cloud-mygo","imyemail-cloud-mygo.exe"}; paths=[path for path in pathlib.Path(sys.argv[1]).rglob("*") if path.is_file() and path.name in names and "deb" not in path.relative_to(sys.argv[1]).parts]; assert len(paths)==1, paths; print(paths[0].resolve())' "$unpacked")
          "$binary" --version
          "$binary" --self-test --data-dir "$(python3 -c 'import tempfile; print(tempfile.mkdtemp(prefix="mygo-smoke-"))')"
          if [[ '${{ runner.os }}' == Linux ]]; then
            deb_binary=$(python3 -c 'import pathlib,sys; paths=[path for path in pathlib.Path(sys.argv[1]).rglob("imyemail-cloud-mygo") if path.is_file() and not path.is_symlink()]; assert len(paths)==1, paths; print(paths[0].resolve())' "$unpacked/deb")
            "$deb_binary" --version
            "$deb_binary" --self-test --data-dir "$(python3 -c 'import tempfile; print(tempfile.mkdtemp(prefix="mygo-deb-smoke-"))')"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mygo-${{ strategy.job-index }}
          path: desktop-mygo/dist/release/*
          if-no-files-found: error
      - name: Remove ephemeral macOS identity
        if: always() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.release
        run: |
          security remove-trusted-cert signing/release-cert.pem || true
          security delete-keychain "$RUNNER_TEMP/imyemail-signing/release.keychain-db" || true

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mygo-*
          path: release-assets
          merge-multiple: true
      - name: Publish separate desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEY_BASE64: ${{ secrets.RELEASE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("desktop-mygo/mygo.json"))["version"])')
          tag="mygo-v$version"
          [[ "$tag" =~ ^mygo-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git cat-file -t "$tag")" = tag
          test "$(git rev-parse "$tag^{}")" = "$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release' >&2
            exit 1
          fi
          (cd release-assets && sha256sum -c ./*.sha256)
          bash scripts/sign-release-manifest.sh release-assets
          gh release create "$tag" release-assets/* --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "imyemail-cloud-mygo $version (self-signed desktop preview)" --prerelease \
            --notes "Native MyGo desktop edition, source $GITHUB_SHA. Old native/mobile releases remain available. macOS and Windows use a stable self-signed code-signing certificate; not Apple-notarized or publicly trusted. Linux archives have signed SHA256SUMS, not APT repository signing. Installation, verification and update/rollback: https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/INSTALL.md. Certificate SHA-256: 476ea6e573714e9c46a43471b5938d791e1c3851beb7b3eef8269cf084f48548. All feature boundaries: https://github.com/$GITHUB_REPOSITORY/blob/$tag/desktop-mygo/README.md"
