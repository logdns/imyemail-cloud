name: MyGo desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the verified MyGo desktop preview
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mygo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: MyGo ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, platform: darwin/arm64 }
          - { runner: macos-15-intel, platform: darwin/amd64 }
          - { runner: ubuntu-24.04, platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { runner: windows-latest, platform: windows/amd64 }
          - { runner: windows-11-arm, platform: windows/arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.27.1
          cache-dependency-path: desktop-mygo/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install Linux runtime and vault dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libdbus-1-dev pkg-config fonts-dejavu-core xvfb xauth
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Prepare dependencies
        run: |
          cd desktop-mygo
          go mod download
          cd ../core
          cargo +1.95.0 fetch --locked
      - name: Check Go and Rust desktop contract
        run: |
          set -euo pipefail
          cd desktop-mygo
          test -z "$(gofmt -l *.go)"
          GOPROXY=off go vet ./...
          GOPROXY=off go test -count=1 ./...
          cd ../core
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 clippy --locked --offline -p chck-cli --all-targets --features desktop-vault -- -D warnings
          cargo +1.95.0 test --locked --offline -p chck-cli --lib desktop::tests::
      - name: Build and package
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN=1.95.0
          export GOPROXY=off
          export GOFLAGS=-trimpath
          export RUSTFLAGS=--remap-path-prefix="$GITHUB_WORKSPACE"=/imyemail-cloud
          bash desktop-mygo/scripts/package.sh '${{ matrix.platform }}'
      - name: Verify bundled engine and native view
        run: |
          set -euo pipefail
          cd desktop-mygo
          os_arch=$(echo '${{ matrix.platform }}' | tr / -)
          binary="dist/$os_arch/imyemail-cloud-mygo"
          if [[ '${{ runner.os }}' == macOS ]]; then binary="$binary.app/Contents/MacOS/imyemail-cloud-mygo"; fi
          if [[ '${{ runner.os }}' == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --version
          "$binary" --self-test --data-dir "$(python3 -c 'import tempfile; print(tempfile.mkdtemp(prefix="mygo-smoke-"))')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mygo-${{ strategy.job-index }}
          path: desktop-mygo/dist/release/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mygo-*
          path: release-assets
          merge-multiple: true
      - name: Publish separate desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("desktop-mygo/mygo.json"))["version"])')
          tag="mygo-v$version"
          [[ "$tag" =~ ^mygo-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{}")" = "$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release' >&2
            exit 1
          fi
          (cd release-assets && sha256sum -c *.sha256 && sha256sum *.zip *.deb *.tar.gz > SHA256SUMS)
          gh release create "$tag" release-assets/* --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "imyemail-cloud MyGo $version (desktop preview)" --prerelease \
            --notes "Native MyGo desktop edition, source $GITHUB_SHA. Separate from the original native/mobile clients and Homebrew cask. macOS is ad-hoc signed, not notarized; Windows is unsigned. Requires a system credential vault; no plaintext-secret fallback. Installation and feature boundaries: https://github.com/$GITHUB_REPOSITORY/blob/$tag/desktop-mygo/README.md"
