name: Hosted signing preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Create disposable unsigned PE fixture
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'signing-fixture'
          New-Item -ItemType Directory -Path $directory | Out-Null
          Add-Type -TypeDefinition 'public static class SigningFixture { public static int Value() { return 0; } }' -OutputAssembly "$directory\imyemail-cloud-fixture.dll"
      - name: Sign, verify and clean up without interactive trust prompts
        timeout-minutes: 2
        shell: pwsh
        env:
          RELEASE_P12_BASE64: ${{ secrets.RELEASE_P12_BASE64 }}
          RELEASE_P12_PASSWORD: ${{ secrets.RELEASE_P12_PASSWORD }}
        run: |
          ./scripts/sign-windows.ps1 -Directory "$env:RUNNER_TEMP\signing-fixture"
          $expected = New-Object Security.Cryptography.X509Certificates.X509Certificate2("$env:GITHUB_WORKSPACE\signing\release-cert.der")
          foreach ($store in @('Cert:\LocalMachine\Root', 'Cert:\LocalMachine\TrustedPublisher', 'Cert:\CurrentUser\My')) {
            if (Test-Path "$store\$($expected.Thumbprint)") { throw "Ephemeral identity not removed from $store" }
          }
          if (Test-Path "$env:RUNNER_TEMP\release.p12") { throw 'Temporary private key remains.' }
  macos:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare ephemeral signing identity without interactive prompts
        timeout-minutes: 2
        env:
          RELEASE_P12_BASE64: ${{ secrets.RELEASE_P12_BASE64 }}
          RELEASE_P12_PASSWORD: ${{ secrets.RELEASE_P12_PASSWORD }}
        run: bash scripts/prepare-macos-signing.sh
      - name: Sign and verify a disposable local fixture
        run: |
          set -euo pipefail
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/signing-fixture.c"
          clang "$RUNNER_TEMP/signing-fixture.c" -o "$RUNNER_TEMP/signing-fixture"
          codesign --force --sign "$IMYEMAIL_CLOUD_MACOS_SIGNING_IDENTITY" \
            --keychain "$IMYEMAIL_CLOUD_MACOS_SIGNING_KEYCHAIN" --timestamp=none "$RUNNER_TEMP/signing-fixture"
          codesign --verify --strict "$RUNNER_TEMP/signing-fixture"
          codesign -d --extract-certificates="$RUNNER_TEMP/signing-leaf" "$RUNNER_TEMP/signing-fixture"
          fingerprint=$(openssl x509 -inform DER -in "$RUNNER_TEMP/signing-leaf0" -outform DER | shasum -a 256 | awk '{print $1}')
          test "$fingerprint" = 476ea6e573714e9c46a43471b5938d791e1c3851beb7b3eef8269cf084f48548
      - name: Remove ephemeral fixture and identity
        timeout-minutes: 1
        if: always()
        run: |
          bash scripts/cleanup-macos-signing.sh
          rm -f "$RUNNER_TEMP/signing-fixture" "$RUNNER_TEMP/signing-fixture.c"
