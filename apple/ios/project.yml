name: ChckMailIOS
options:
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '27.0'
packages:
  ChckMail:
    path: ..
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  ChckMailIOSApp:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/ChckMailIOS
      - path: Assets.xcassets
    dependencies:
      - package: ChckMail
        product: ChckUI
      - package: ChckMail
        product: ChckAppCore
      - package: ChckMail
        product: ChckDesign
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: libiconv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: email.imy.cloud
        PRODUCT_NAME: ChckMailIOS
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_DEBUG_DYLIB: NO
        OTHER_LDFLAGS: '$(inherited) -force_load "$(SRCROOT)/../Native/$(PLATFORM_NAME)/libchck_mail.a" -Wl,-export_dynamic'
    preBuildScripts:
      - name: Build Rust iOS core
        script: '"$SRCROOT/../scripts/build-ios-native.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - '$(SRCROOT)/../Native/$(PLATFORM_NAME)/libchck_mail.a'
    postBuildScripts:
      - name: Remove host-only SwiftPM library resource
        script: 'find "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" -path "*.bundle/*" -name libchck_mail.dylib -delete'
        basedOnDependencyAnalysis: false
  ChckMailIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ChckMailIOSApp
      - package: ChckMail
        product: ChckAppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: email.imy.cloud.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ChckMailIOSApp
schemes:
  ChckMailIOSApp:
    build:
      targets:
        ChckMailIOSApp: all
    test:
      gatherCoverageData: false
      environmentVariables:
        IMYEMAIL_CLOUD_TEST_CONVERTER_URL: '$(IMYEMAIL_CLOUD_TEST_CONVERTER_URL)'
      targets:
        - ChckMailIOSUITests
