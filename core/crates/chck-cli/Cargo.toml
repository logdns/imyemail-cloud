[package]
name = "chck-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "imyemail-cloud 第一客户端：命令行，验证 MailEngine 收发读"

[[bin]]
name = "imyemail-cloud"
path = "src/main.rs"

[dependencies]
chck-engine.workspace = true
chck-types.workspace = true
chck-ffi.workspace = true
serde_json.workspace = true

[features]
desktop-vault = ["dep:keyring"]

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"], optional = true }

[dev-dependencies]
rustls.workspace = true
rustls-pki-types.workspace = true
rcgen = "0.14"

[lints]
workspace = true
