[package]
name = "linux"
version = "0.2.2"
edition = "2024"
license = "MIT"
description = "imyemail-cloud Linux 客户端。GTK4 + libadwaita，crate 直连 core。"
repository = "https://github.com/logdns/imyemail-cloud"
authors = ["imy.email"]

[[bin]]
name = "imyemail-cloud"
path = "src/main.rs"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chck-engine = { path = "../core/crates/chck-engine" }
chck-types = { path = "../core/crates/chck-types" }
chck-cli = { path = "../core/crates/chck-cli" }
async-channel = { version = "2", optional = true }
gtk4 = { version = "0.9", optional = true, features = ["v4_14"] }
libadwaita = { version = "0.7", optional = true, features = ["v1_5"] }
libsecret = { version = "0.6", optional = true }
webkit6 = { version = "0.4", optional = true }

[features]
default = []
gtk = ["dep:gtk4", "dep:libadwaita", "dep:async-channel"]
secret = ["dep:libsecret"]
webkit = ["dep:webkit6"]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
