app-id: email.imy.cloud
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: imyemail-cloud
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.gnome.OnlineAccounts
  - --filesystem=xdg-download
  - --env=RUST_BACKTRACE=1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/imyemail-cloud/cargo
    CARGO_NET_OFFLINE: "true"
modules:
  - name: imyemail-cloud
    buildsystem: meson
    config-opts:
      - -Dprofile=release
    sources:
      - type: dir
        path: ..
