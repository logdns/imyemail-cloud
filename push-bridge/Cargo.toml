[package]
name = "push-bridge"
version = "0.2.4"
edition = "2024"
license = "MIT"
description = "imyemail Webhook → APNs/FCM。只转发账号/文件夹元数据。"

[[bin]]
name = "push-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
